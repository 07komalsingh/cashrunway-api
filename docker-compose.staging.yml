services:
  api:
    image: cashrunway-api:${IMAGE_TAG:-latest}
    container_name: cashrunway-staging
    environment:
      PORT: 3000
      APP_VERSION: ${IMAGE_TAG:-latest}
      DB_HOST: db
      DB_USER: cashrunway
      DB_PASSWORD: cashrunway
      DB_NAME: cashrunway
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8
    container_name: cashrunway-staging-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: cashrunway
      MYSQL_USER: cashrunway
      MYSQL_PASSWORD: cashrunway
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpw"]
      interval: 10s
      timeout: 5s
      retries: 10
