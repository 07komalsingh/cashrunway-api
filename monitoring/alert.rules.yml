groups:
  - name: cashrunway-availability
    rules:
      - alert: ApiDown
        expr: up{job=~"cashrunway-.*"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "CashRunway API is not responding ({{ $labels.environment }})"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for 30 seconds."

      - alert: HighErrorRate
        expr: |
          sum(rate(cashrunway_http_requests_total{status=~"5.."}[2m]))
            / sum(rate(cashrunway_http_requests_total[2m])) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are returning server errors"

      - alert: SlowForecastResponses
        expr: histogram_quantile(0.95, sum(rate(cashrunway_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile response time is above one second"
